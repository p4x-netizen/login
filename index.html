<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }
    body{
        background: #e0e5ec;
    }
    .input-field{
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        margin-top: 350px;
    }
    .input-field input{
        padding: 12px 15px;
        border: none;
        outline: none;
        background: #e0e5ec;
        border-radius: 25px;
        box-shadow: inset 8px 8px 16px #a3b1c6,
        inset -4px -4px 8px #ffff;
    }
</style>
<body>
    <form>
        <div class="input-field">
            <input type="text" name="" id="" placeholder="Username">
        </div>
    </form>
</body>
</html>
